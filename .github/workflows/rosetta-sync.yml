name: Rosetta Code Auto-Scraper

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - name: Checkout Zen-C Repository
        uses: actions/checkout@v4
        with:
          path: 'zen-c'
          token: ${{ secrets.WEBSITE_REPO_TOKEN }}
          fetch-depth: 0

      - name: Checkout Docs Repository
        uses: actions/checkout@v4
        with:
          repository: 'zenc-lang/docs'
          token: ${{ secrets.WEBSITE_REPO_TOKEN }}
          path: 'docs'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        # A few Rosetta solutions import system libraries (GNU MP, GTK3); the
        # scraper build-validates every example, so those headers must be
        # available for such examples to be kept.
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev libgtk-3-dev

      - name: Build Zen C compiler
        working-directory: zen-c
        # JIT (libtcc) is not needed for transpile/build validation.
        run: make -j$(nproc) ZC_HAS_JIT=0

      - name: Setup Awesome-Zen-C repository
        run: |
          cd zen-c
          git clone https://x-access-token:${{ secrets.WEBSITE_REPO_TOKEN }}@github.com/zenc-lang/awesome-zenc.git examples

      - name: Run Rosetta Code Scraper
        # The scraper validates every candidate solution with `zc transpile`
        # and `zc build` before writing it, so broken or invalid examples are
        # never committed.
        run: |
          cd zen-c
          export ZC_ROOT=$PWD
          export ZC_BINARY=$PWD/zc
          python .github/scripts/scrape_rosetta.py

      - name: Commit .zc files to Awesome-Zen-C Repo
        run: |
          cd zen-c/examples
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main || git checkout -b main
          git add examples/rosetta/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-sync new Rosetta Code examples" && git push origin HEAD:main)


      - name: Sync Markdown to Docs Repo
        run: |
          mkdir -p docs/rosetta/
          rsync -avz --delete --exclude='_index.md' zen-c/website_out/ docs/rosetta/
          
          cd docs
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rosetta/
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: auto-sync Rosetta Code examples from zenc repo" && git push)
